name: Link public arXiv paper
on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/publish/update_arxiv.py
      - id: commit
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name 'FIBER'
            git config user.email 'fiberaa@users.noreply.github.com'
            git add index.html
            git commit -m 'Link the public FIBER arXiv paper'
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-pages.yml
