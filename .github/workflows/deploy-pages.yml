name: Deploy FIBER site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate static site
        run: |
          test -f index.html
          test -f static/css/index.css
          test -f static/js/index.js
          test -d static/images
          test -d static/videos

      - name: Build static site artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp -R static _site/static
          mkdir -p _site/playground
          rsync -a --exclude=models/ playground/ _site/playground/
          rm -rf _site/playground/models
          python3 tools/publish/assemble_models.py
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
